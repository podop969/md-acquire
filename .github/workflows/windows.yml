name: windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Test
        shell: pwsh
        run: python -m pytest -v
      - name: CLI smoke
        shell: pwsh
        # pwsh steps only check the LAST command's exit code, so each one is checked here.
        # bulk exits 1 when any spec stays pending: an in-copyright book has no open copy
        # and goes to wanted.md, which is the tool working. A crash also exits 1 but never
        # prints the summary line, so exit 1 passes only when that line is present.
        run: |
          python -m pipeline.cli --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = python -m pipeline.bulk --dry-run
          $code = $LASTEXITCODE
          $log
          if ($code -eq 0 -or ($code -eq 1 -and ($log -match '^bulk done\. '))) { exit 0 }
          exit $code
        env:
          ACQUIRE_EMAIL: ci@example.org